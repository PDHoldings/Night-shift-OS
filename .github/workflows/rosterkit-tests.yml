name: RosterKit tests

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "RosterKit/**"
      - ".github/workflows/rosterkit-tests.yml"
  pull_request:
    paths:
      - "RosterKit/**"
      - ".github/workflows/rosterkit-tests.yml"

jobs:
  test-linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run RosterKit tests
        working-directory: RosterKit
        run: swift test

  test-macos:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
      - name: Run RosterKit tests
        working-directory: RosterKit
        run: swift test
